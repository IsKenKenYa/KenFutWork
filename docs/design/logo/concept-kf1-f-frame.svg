<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KF-1 · 上F下K：竖笔共享，F 的顶横+中横在上，K 的腿从中横下方伸出 -->
  <defs>
    <linearGradient id="design" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#575E96"/>
      <stop offset="1" stop-color="#686FA9"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C4272"/>
      <stop offset="1" stop-color="#494F84"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#design)"/>
    <path d="M512 0 L512 512 L0 512 Z" fill="url(#code)"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="156" y="128" width="72" height="256" rx="8"/>
    <rect x="156" y="128" width="164" height="72"/>
    <rect x="156" y="228" width="164" height="72"/>
  </g>
  <path d="M192 264 L352 360" stroke="#FFFFFF" stroke-width="72" fill="none"/>
</svg>
