name: 功能请求
description: 提出新功能或改进
title: "[Feature] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        大改动请先在此对齐范围，再开 PR。不要在公开 issue 中提交客户合同、报价或机密信息。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 范围
      options:
        - Code
        - Design
        - Flow
        - Work
        - 基础设施
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
      description: 你考虑过哪些替代做法？
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue
          required: true
        - label: 这不是安全漏洞（安全问题走私报渠道）
          required: true
