name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        不要贴密钥、凭据、个人数据或客户信息。安全漏洞请走 `SECURITY.md` 的私报渠道，不要开公开 issue。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 应用版本、commit 或分支
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Windows
        - Linux
        - Web
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 请先脱敏；没有可留空
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue
          required: true
        - label: 内容不含密钥、个人数据或客户信息
          required: true
