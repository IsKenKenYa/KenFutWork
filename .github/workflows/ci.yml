name: CI 门禁

# 只做「静态门禁 + 各包测试 + 迁移重放」三件事，**不含任何打包**：
# 出包失败不该染红 PR，打包链在 build-debug.yml（手动触发）里跑。
on:
  pull_request:
    branches: [main, 啃啃在开发]
  push:
    # 分支命名约定（AGENTS.md）里的 agent 分支也要跑门禁：只在 main / 主开发分支上跑，
    # 等于「修 CI 的分支自己不被 CI 检查」——本轮就是这么漏掉三次假绿的。
    branches:
      - main
      - 啃啃在开发
      - "qoder/**"
      - "codex/**"
      - "claude/**"
      - "trae/**"
      - "人/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # 关闭 turbo 遥测，避免 CI 日志里混入无关输出
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: 静态门禁（仓库级 · 改动 lint · 类型）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 显式声明 shell：不写就是「平台给什么 shell 用什么」（Windows 是 PowerShell、
    # 容器是 dash），bash 写法会以一种离根因很远的姿态失败。由 check-actions 的 A6 把守。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 迁移重放的篡改自检要写文件，但门禁本身不需要历史；submodules 是参考仓，
          # 既不进 CI 也不该被拉（否则几百 MB 白下）
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 这一条就覆盖：root 脚本装配、各 app 脚本真实性、文档治理（冻结区/断链/第二处
      # ctx key 表）、env 权威表与样例互锁、去 Supabase 棘轮、库约束↔契约枚举、
      # 安装向导图 DPI、桌面版本四处一致 + .nvmrc 与 engines 同值。
      # 工作流文件本身也是产品代码：actionlint 查 YAML/schema/action 参数与表达式，
      # 它在 PATH 上看见 shellcheck 后会顺带把每个 run: 块当 shell 脚本查一遍。
      # 自研护栏（check-actions.mjs）只留「官方文档不报错但 job 静默不干活」那 6 条。
      - name: actionlint + ShellCheck（工作流与脚本静态检查）
        run: |
          set -euo pipefail
          # 宿主 runner（非容器）里当前用户不是 root，apt 必须 sudo（runner 有免密 sudo）。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin
          actionlint -version
          pnpm run test:actions
          # 第一方 shell 脚本单独查一遍。bundle_dmg.sh 是 appdmg 上游产物（6 处既存告警），
          # 不在本轮范围内批量改动第三方脚本，故排除并留名。
          shellcheck --severity=warning \
            apps/desktop/dev.sh \
            apps/server/src/features/computer-use/fixtures/run-linux-desktop.sh \
            .agents/skills/diagnosing-bugs/scripts/hitl-loop.template.sh \
            .agents/skills/git-guardrails-claude-code/scripts/block-dangerous-git.sh \
            .agents/skills/wizard/template.sh

      - name: 仓库级门禁
        run: pnpm run test:workspace

      # 仓库当前有 92 处既存 Biome 报错（不是本 PR 造成的）：全仓 `pnpm lint` 当硬门会让
      # 每个 PR 都红，反而没人看。这里只判**本次改动**的文件；全仓欠债另立单子收敛。
      - name: Biome（只判本次改动的文件）
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "· 找不到比较基线，跳过改动 lint（不误判为通过：这一步本就不覆盖全仓）"
            exit 0
          fi
          mapfile -d '' -t changed < <(git diff -z --diff-filter=ACMR --name-only "$base" "$GITHUB_SHA")
          files=()
          for path in "${changed[@]}"; do
            case "$path" in
              *.cjs | *.js | *.mjs | *.ts | *.tsx | *.json) files+=("$path") ;;
            esac
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "· 本次无 JS/TS/JSON 改动"
            exit 0
          fi
          printf '%s\0' "${files[@]}" | xargs -0 pnpm exec biome check

      # 桌面壳的 typecheck/test 是 cargo（apps/desktop/package.json:11-12），ubuntu runner 上
      # 没有 Rust + webkit2gtk 系统库，改由 mac lane 负责；这里显式排除而不是让它红。
      # 先按图建上游：`@kenfutwork/shared` 与 `apps/server` 都直接 import vendored
      # `@zcode/*`（含 @zcode/window-controller）的产物，干净检出下 tsc 会 TS2307。
      # server 的依赖集正好覆盖两者，故按 server 的传递依赖构建，而不是手工列包名。
      - name: 构建 server 的上游依赖
        run: pnpm exec turbo run build --filter=@kenfutwork/server^... --concurrency=1

      - name: 类型检查（排除桌面壳，它归 mac/win lane）
        run: pnpm exec turbo run typecheck --filter=!@kenfutwork/desktop --concurrency=1

  packages-test:
    name: 各包测试（shared / web / ui / config）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 显式声明 shell：不写就是「平台给什么 shell 用什么」（Windows 是 PowerShell、
    # 容器是 dash），bash 写法会以一种离根因很远的姿态失败。由 check-actions 的 A6 把守。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 桌面壳（cargo）在 mac lane，`apps/server` 在 server-sandbox job（真沙箱需要
      # bwrap，托管 runner 主环境里非特权命名空间被禁）。AGENTS.md 的测试资源护栏：
      # 确需串行用 turbo --concurrency=1（不是把参数塞给 pnpm run，`--` 之后的会被各包
      # 任务当成自己的选项而报错）。
      - name: turbo 跑各包测试
        run: pnpm exec turbo run test --filter=!@kenfutwork/desktop --filter=!@kenfutwork/server --concurrency=1

  # Linux 进程沙箱只有 Linux 能真验：`@anthropic-ai/sandbox-runtime` 在
  # `task-helper.ts:189-197` 预检依赖（ripgrep / socat / bubblewrap），缺则抛
  # `enforcement_unavailable`（实测 36 条用例死在这）。实测托管 runner 的主环境里
  # 三个工具都能装齐，但 bwrap 仍报 `setting up uid map: Permission denied`
  # ——Ubuntu 24.04 限制非特权用户命名空间。故把这批用例放进 `--privileged` 容器 job：
  # 探针先给结论，能用就跑真沙箱，不能用就红在这里说清，而不是把 36 条用例静默跳过。
  server-sandbox:
    name: server 测试（Linux 真沙箱 · privileged 容器）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    container:
      # 与 .nvmrc 同一个钉住版本：`node:24-bookworm` 是浮动 tag，实测解析到 24.21.0，
      # 而仓库锁的是 24.11.1——测试环境与 SEA 宿主/桌面捆绑的 Node 不是同一份，
      # 「CI 绿了」就不能作为发布运行时的证据。由 check-actions 的 A7 对账 .nvmrc。
      image: node:24.11.1-bookworm
      # --init：容器 PID 1 换成 tini 这类会 reap 的 init。沙箱的停止确认要「命名空间内
      # 进程数归零」，而 job 容器的 PID 1 不会收养并回收孤儿僵尸，杀完最后一层后僵尸
      # 永远挂在 /proc 里，实测报 stop_unconfirmed（范围里仍有进程）。
      options: --privileged --init
    timeout-minutes: 45
    # 容器 job 的默认 shell 是 sh（dash），不认 `set -o pipefail`——实测第一步就报
    # `Illegal option -o pipefail` 退 2。与 Windows 那次 PowerShell 默认 shell 同一类错误。
    defaults:
      run:
        shell: bash
    env:
      # 容器内没有 Actions 的 setup-node，pnpm 由 corepack 按 packageManager 字段取版本
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 安装沙箱依赖（ripgrep + socat + bubblewrap）
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ripgrep socat bubblewrap
          for tool in rg socat bwrap; do
            command -v "$tool" >/dev/null || { echo "· 容器里缺 $tool"; exit 1; }
            echo "· $tool → $(command -v $tool)"
          done

      - name: 放开「无能力 userns」限制（Ubuntu 24.04 AppArmor 默认值）
        run: |
          set -euo pipefail
          # 托管 runner 是 Ubuntu 24.04：kernel.apparmor_restrict_unprivileged_userns=1
          # 允许非特权进程 unshare 用户命名空间，但**剥掉新命名空间里的能力**。
          # bwrap 自己 --unshare-user 照样能起（所以只验它能起会假绿），而沙箱真正的
          # 隔离层 apply-seccomp 在 bwrap 内再嵌一层 userns 时，写 /proc/self/setgroups
          # 直接 EPERM，整条命令启动失败。SRT 官方要求把它关掉。
          for knob in \
            kernel.apparmor_restrict_unprivileged_userns \
            kernel.apparmor_unprivileged_userns_apparmor_policy; do
            path="/proc/sys/${knob//./\/}"
            [ -e "$path" ] || { echo "· $knob 不存在（非 24.04 系内核，无需处理）"; continue; }
            before="$(cat "$path")"
            echo "· $knob 原值 $before"
            [ "$before" = "0" ] && continue
            if ! echo 0 > "$path" 2>/tmp/knob.err; then
              echo "· 无法关闭 $knob：$(cat /tmp/knob.err)"
              echo "  → privileged 容器的 /proc/sys 仍只读；不要改成跳过用例，改用带该能力的自建 Linux runner"
              exit 1
            fi
            after="$(cat "$path")"
            [ "$after" = "0" ] || { echo "· $knob 写完回读仍是 $after"; exit 1; }
            echo "· $knob 已置 0"
          done

      - name: 沙箱能力探针（打印环境结论，判定交给真实用例预检）
        run: |
          set -euo pipefail
          # 这步只**报告**，不**判定**：手写 bwrap 探针连着两次给出假红（先误把「bwrap 能起」
          # 当成可用，后又因为没 --map-root-user 让嵌套 userns 的 CapEff 全 0）。
          # 判定权在下一步——它跑的是产品代码路径，结论不可能和真实用例不一致。
          echo "· 自身能力：$(grep -E '^Cap(Bnd|Eff):' /proc/self/status | tr '\n' ' ')"
          for knob in kernel.apparmor_restrict_unprivileged_userns; do
            echo "· $knob = $(cat "/proc/sys/${knob//./\/}" 2>/dev/null || echo '(不存在)')"
          done
          bwrap --version
          node --version
          nested="$(bwrap --ro-bind / / --dev /dev --proc /proc \
            --unshare-user --unshare-pid --cap-drop ALL --cap-add CAP_SETFCAP \
            /bin/sh -c 'unshare -Um sh -c "grep ^CapEff: /proc/self/status"' 2>&1 | tail -1)" || {
              echo "· bwrap 起不来：${nested}"
              echo "  → 禁止跳过或削弱沙箱；换用允许能力型 userns 的 runner。"
              exit 1
            }
          echo "· 嵌套 userns（map-root）CapEff：${nested:-（读不到）}"

      - name: 启用 pnpm
        run: corepack enable && pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 server 的上游依赖
        run: pnpm exec turbo run build --filter=@kenfutwork/server^... --concurrency=1

      - name: 真沙箱预检（一条真实用例先跑，失败日志就在最前面）
        run: |
          set -euo pipefail
          # 预检走产品代码路径（SRT + bwrap + apply-seccomp + 读写隔离探针），而不是手工拼
          # bwrap 参数：手工拼的探针会和真实用例给出不同结论（本轮就撞过一次假红）。
          # 失败时把 helper 的原始 stderr 留在这一段的输出里，别让它在 45 分钟的整包日志里翻不到。
          pnpm --filter @kenfutwork/server exec vitest run \
            src/features/process-sandbox/service.test.ts \
            -t "真实命令的输出可继续读取"

      - name: server 测试（串行，避免内存踩踏）
        run: pnpm exec turbo run test --filter=@kenfutwork/server --concurrency=1

  db-replay:
    name: 迁移空库重放 + 二次 no-op
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 显式声明 shell：不写就是「平台给什么 shell 用什么」（Windows 是 PowerShell、
    # 容器是 dash），bash 写法会以一种离根因很远的姿态失败。由 check-actions 的 A6 把守。
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: kenfutwork
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KENFUTWORK_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/kenfutwork
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # shim 装法与桌面打包期一致，抽成复合动作给「迁移重放」与「健康检查」两个 job 共用。
      - uses: ./.github/actions/pgmq-shim

      # `migrate.ts` 经 `config/env.ts` 引 `@kenfutwork/shared` 的产物；先建 shared 及其上游，
      # 否则干净检出上报 `Cannot find module .../shared/dist/index.js`（首轮实测）。
      - name: 构建 shared 及其上游
        run: pnpm exec turbo run build --filter=@kenfutwork/server^... --concurrency=1

      # 《AGENTS.md》数据库硬约束的机械落地：93 条历史必须能在空库从零重放，且第二轮必须
      # 一条都不执行（no-op）。入口是 apps/server/src/migrate.ts 的 replay 模式（:186-237）。
      - name: 空库全量重放 + 二次 no-op
        run: pnpm --filter @kenfutwork/server exec node --import tsx src/migrate.ts replay

      # 「一个永远 PASS 的检查等于没有检查」：改一个已记账迁移的字节，`status` 必须红。
      # 不这么做的话，SHA-256 账本校验坏成「静默通过」也没人发现。
      - name: 篡改历史迁移必须被拦（自检）
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @kenfutwork/server exec node --input-type=module -e "
          import { Client } from 'pg';
          const admin = new Client({ connectionString: process.env.KENFUTWORK_DATABASE_URL });
          await admin.connect();
          await admin.query('drop database if exists drift_probe with (force)');
          await admin.query('create database drift_probe');
          await admin.end();
          console.log('· 探针库 drift_probe 已建');
          "
          # 探针库里先干净落一遍账本，再改文件——这样漂移只可能来自「改动已记账的迁移」。
          probe_url="${KENFUTWORK_DATABASE_URL%/*}/drift_probe"
          KENFUTWORK_DATABASE_URL="$probe_url" \
            pnpm --filter @kenfutwork/server exec node --import tsx src/migrate.ts apply
          target="$(find supabase/migrations -name '*.sql' | sort | head -1)"
          printf '\n-- CI 篡改探针\n' >> "$target"
          if KENFUTWORK_DATABASE_URL="$probe_url" \
            pnpm --filter @kenfutwork/server exec node --import tsx src/migrate.ts status; then
            echo "· 期望：改了已执行迁移的内容后 status 必须报校验和不一致，但它退 0 了——门禁坏了"
            exit 1
          fi
          echo "· 篡改已被拦下（历史 SHA-256 账本对账生效）"

  # 免费且零配置：只对**本次 PR 变更的依赖**做审查（不是全仓扫描，既存告警不会让它常红）。
  # 与 Dependabot 的差别：Dependabot 看的是「已知漏洞的既有依赖」，这里看的是
  # 「这次 diff 新引入/换版本的依赖有没有漏洞、许可证是否变化」，PR 里直接留评论。
  secrets-scan:
    name: 密钥扫描（全历史，gitleaks）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆只会让 gitleaks 看到 1 个提交——表现是「绿了，但什么都没扫」。
          fetch-depth: 0
          submodules: false
      - name: 安装 gitleaks
        run: |
          set -euo pipefail
          # 与本地验证同一版本；二进制直取 release 资产，避免依赖需要 license 的包装 action。
          version=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: 扫描全历史
        run: |
          set -euo pipefail
          # 豁免只按「具体值」放行（见 .gitleaks.toml）：同文件里将来出现真 Key 仍会被拦。
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -c .gitleaks.toml

  dependency-review:
    name: 依赖变更审查（只在 PR 上跑）
    if: github.repository == 'IsKenKenYa/KenFutWork' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sca-osv:
    name: 依赖漏洞扫描（OSV 锁文件级，上报到代码扫描）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 安装 osv-scanner
        run: |
          set -euo pipefail
          version=2.6.0
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${version}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version
      - name: 扫描 npm 与 Cargo 锁文件
        run: |
          set -uo pipefail
          # 本 job 的口径是「让公告被看见」（Security 标签 + 告警），不是在此处染红：
          # 存量 29 个包 / 49 条公告（含传递依赖）需要的是被跟踪，而不是被静音。
          # 「新增高危依赖」由 dependency-review 在 PR 上拦。
          "$RUNNER_TEMP/osv-scanner" scan source \
            -L pnpm-lock.yaml \
            -L apps/desktop/src-tauri/Cargo.lock \
            --format sarif --output-file "$RUNNER_TEMP/osv.sarif"
          code=$?
          # 退出码 1 = 发现公告（正常）；但没产出 SARIF 就是扫描器自己失败，必须说出来。
          if [ ! -s "$RUNNER_TEMP/osv.sarif" ]; then
            echo "· osv-scanner 退出码 $code 且没有产出 SARIF —— 这是扫描失败，不是没有漏洞"
            exit 1
          fi
          echo "· osv-scanner 退出码 $code（1=有公告），SARIF 已生成"
      - name: 上传 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/osv.sarif
          category: osv-scanner

  health-check:
    name: 服务端健康检查（真库启动 + /api/health + 未授权边界）
    if: github.repository == 'IsKenKenYa/KenFutWork'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: kenfutwork
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KENFUTWORK_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/kenfutwork
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/pgmq-shim
      - name: 构建 server 及其上游
        run: pnpm exec turbo run build --filter=@kenfutwork/server^... --concurrency=1

      # 迁移必须落在**目标库**上：`replay` 建临时库验证后即删（db-replay 那条 job 的口径），
      # 用它当健康检查的前置会得到一个空库，服务端起来就因缺表退出。
      - name: 迁移目标库
        run: pnpm --filter @kenfutwork/server exec node --import tsx src/migrate.ts apply

      # 真启动整个服务端（不是 mock、不是单测里的 app 实例），验三件事：
      #   1) /api/health 200 且 service 名对得上；
      #   2) 带本机凭据边界的业务路由在没有凭据时必须 401（不能因为 CI 少配了鉴权就放行）；
      #   3) 进程没有早退——早退就把服务端日志原样打出来，别让「curl 连不上」当唯一线索。
      - name: 启动服务端并做健康检查
        env:
          KENFUTWORK_DATA_DIR: ${{ runner.temp }}/kfw-health-data
          KENFUTWORK_SERVER_PORT: "39111"
          HOST: 127.0.0.1
          HEALTH_FILE: ${{ runner.temp }}/health.json
        run: |
          set -uo pipefail
          mkdir -p "$KENFUTWORK_DATA_DIR"
          log="$RUNNER_TEMP/server.log"
          pnpm --filter @kenfutwork/server exec node --import tsx src/server.ts > "$log" 2>&1 &
          pid=$!
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:39111/api/health || true)"
            [ "$code" = "200" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "· 服务端启动后退出，日志如下："
              cat "$log"
              exit 1
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "· /api/health 60 次轮询后仍是 $code，日志如下："
            cat "$log"
            exit 1
          fi
          echo "· /api/health $(cat "$RUNNER_TEMP/health.json")"
          node -e '
            const payload = JSON.parse(require("node:fs").readFileSync(process.env.HEALTH_FILE, "utf8"));
            if (payload.ok !== true) throw new Error("health.ok 不是 true：" + JSON.stringify(payload));
            if (payload.service !== "kenfutwork-server") throw new Error("service 名不符：" + payload.service);
          ' 2>&1 || { echo "· 健康响应体不合规"; cat "$log"; exit 1; }
          for route in "/api/projects?kind=code" "/api/models"; do
            unauth="$(curl -s -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' "http://127.0.0.1:39111$route")"
            if [ "$unauth" != "401" ]; then
              echo "· $route 无凭据时返回 $unauth（应为 401）：$(cat "$RUNNER_TEMP/unauth.json")"
              kill "$pid" 2>/dev/null || true
              exit 1
            fi
            echo "· $route 无凭据 → 401（本机凭据边界生效）"
          done
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "· 服务端已正常关停"
