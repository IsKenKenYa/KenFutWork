[package]
name = "kenfutwork-desktop"
version = "0.1.0"
edition = "2021"
default-run = "kenfutwork-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
signal-hook = "0.3"

[lib]
name = "kenfutwork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
