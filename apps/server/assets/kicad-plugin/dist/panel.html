<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiCad board</title>
<style>/* Heights are fixed pixels while the card is inline: the host sizes the iframe from the height this page reports, so a height that follows the viewport (vh) can feed back
   into itself (not observed in tests; the caps are pixels as a precaution). In the side pane (displayMode "fullscreen") the pane has its own height and the caps follow it. */
:root { --h22:198px; --h24:216px; --h40:360px; --h44:396px; --h46:414px; --h62:558px; --h68:612px; --h72:648px; }
html[data-mode="fullscreen"] { --h22:22vh; --h24:24vh; --h40:40vh; --h44:44vh; --h46:46vh; --h62:62vh; --h68:68vh; --h72:72vh; }
:root { color-scheme: light dark; --bg:#fbfaf8; --fg:#1f2328; --mut:#6b7280; --line:#e5e1da; --card:#fff; --ok:#1a7f4b; --bad:#c0392b; --warn:#b7791f; --acc:#2563eb;
  --c-circuit:#b45309; --c-structure:#0f766e; --c-firmware:#6d28d9; --c-lead:#374151; }
[data-theme="dark"] { --bg:#16181c; --fg:#e6e6e6; --mut:#9aa3af; --line:#2b3037; --card:#1d2025; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --acc:#60a5fa;
  --c-circuit:#fbbf24; --c-structure:#2dd4bf; --c-firmware:#a78bfa; --c-lead:#cbd5e1; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
#root { padding:12px 14px 18px; }
h1 { font-size:15px; margin:0 0 2px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:16px 0 6px; font-weight:600; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .sp { flex:1; }
.mut { color:var(--mut); } .mono { font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; }
button { font:inherit; padding:3px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
button:hover { border-color:var(--acc); } button[aria-pressed="true"] { background:var(--acc); color:#fff; border-color:var(--acc); }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid currentColor; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.grid { display:grid; gap:8px; } .g3 { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
img.board { width:100%; max-height:var(--h46); object-fit:contain; background:var(--bg); border-radius:8px; border:1px solid var(--line); }
table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:2px 6px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--mut); font-weight:500; }
.scroll { max-height:var(--h22); overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--card); }
.feed { display:flex; flex-direction:column; gap:6px; }
.msg { border-left:3px solid var(--line); padding:3px 8px; background:var(--card); border-radius:0 6px 6px 0; }
.chip { font-size:11px; padding:0 6px; border-radius:4px; background:var(--line); margin-left:6px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line); margin-right:6px; } .dot.live { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
details > summary { cursor:pointer; color:var(--mut); } pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; max-height:var(--h24); overflow:auto; }
button.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
button.primary:disabled { opacity: .6; }
.banner { display:flex; gap:6px; align-items:center; margin-top:8px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
.title { display:flex; gap:10px; align-items:center; min-width:0; }
.logo { flex:none; width:34px; height:34px; border-radius:8px; overflow:hidden; display:inline-block; }
.logo svg { width:100%; height:100%; display:block; }
/* tabs (Layers, 3D, Schematic, Checks, Library) */
.tabs { display:flex; gap:2px; margin-top:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab { border:none; border-bottom:2px solid transparent; border-radius:6px 6px 0 0; background:transparent; padding:4px 10px; color:var(--mut); }
.tab:hover { color:var(--fg); border-color:transparent; } .tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--acc); font-weight:600; }
.split { display:grid; grid-template-columns:minmax(150px,210px) 1fr; gap:12px; align-items:start; } .split.lib { grid-template-columns:1fr 1fr; }
.lyrs { display:flex; flex-direction:column; gap:3px; } .lyr { display:flex; gap:6px; align-items:center; cursor:pointer; } .lyr .mono { margin-left:auto; } .lyr.mirror { margin-top:8px; padding-top:6px; border-top:1px solid var(--line); }
.sw { width:12px; height:12px; border-radius:3px; border:1px solid var(--line); flex:none; }
.stagewrap { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px; }
.stack { position:relative; width:100%; max-height:var(--h62); margin:0 auto; } .stack img.layer { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.paper { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; } .paper.scroll-big { max-height:var(--h68); overflow:auto; margin-top:8px; } .paper .pad { padding:16px; }
img.sch { display:block; max-width:none; height:auto; } .paper > img.sch { margin:0 auto; }
.small { font-size:12px; } .grow { flex:1; min-width:140px; } input[type="search"], select { font:inherit; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
.empty { text-align:center; padding:22px 14px; } .empty p { max-width:52ch; margin:8px auto 12px; }
tr.pick { cursor:pointer; } tr.pick:hover td, tr.pick.sel td { background:color-mix(in srgb, var(--acc) 12%, transparent); } a.link { color:var(--acc); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
/* live link */
button.badge.live { background:transparent; cursor:pointer; font:inherit; font-size:12px; padding:1px 8px; display:inline-flex; align-items:center; } button.badge.live .dot { margin-right:5px; } button.badge.mut { color:var(--mut); }
.scroll.tall { max-height:var(--h44); } tr.moved td { background:color-mix(in srgb, var(--warn) 14%, transparent); } tr.moved { animation:moved-flash 1.6s ease-out 1; } @keyframes moved-flash { from { outline:2px solid var(--warn); } to { outline:2px solid transparent; } }</style>
</head>
<body>
<div id="root"></div>
