packages:
  - apps/*
  - packages/*

ignoredBuiltDependencies:
  - '@biomejs/biome'
  - msw
  # 只分发 Postgres 17 二进制；其 postinstall 仅重建 POSIX 符号链接（Windows 上无意义）
  - '@embedded-postgres/windows-x64'

onlyBuiltDependencies:
  - esbuild
  - sharp
  # 真实交互终端要的是 PTY（conpty），必须让它跑 native 构建/预编译下载
  - node-pty
