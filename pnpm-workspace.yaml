packages:
  - apps/*
  - packages/*
  - apps/web/src/components/workbench/zcode

# 上游发布包把运行依赖列在 devDependencies；按其实际 ESM import 补充。
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.3':
    dependencies:
      '@deepseek-ai/dsh-util-workspace-path': 0.2.2-rc.3
      '@deepseek-ai/dsh-client-store': 0.2.2-rc.3
      '@deepseek-ai/dsh-util-code-language': 0.2.2-rc.3
      '@shikijs/langs': ^4.4.3
      clsx: ^2.0.0
      simple-icons: 16.31.0
      shiki: ^4.4.3
      anser: ^2.3.5
      diff: ^9.0.0
      katex: ^0.18.7
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-extension-gfm: ^3.0.0
      micromark-extension-math: ^3.1.0
      micromark-core-commonmark: ^2.0.3
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-factory-space: ^2.0.1
      micromark-util-decode-string: ^2.0.1
      micromark-util-sanitize-uri: ^2.0.1

ignoredBuiltDependencies:
  - '@biomejs/biome'
  - msw
  # 只分发 Postgres 17 二进制；其 postinstall 仅重建 POSIX 符号链接（Windows 上无意义）
  - '@embedded-postgres/windows-x64'

onlyBuiltDependencies:
  # macOS Postgres 需要 postinstall 按随包清单恢复动态库软链，否则干净安装无法启动。
  - '@embedded-postgres/darwin-arm64'
  - '@embedded-postgres/darwin-x64'
  - esbuild
  - sharp
  # 真实交互终端要的是 PTY（conpty），必须让它跑 native 构建/预编译下载
  - node-pty
  # 不要往这里加 appdmg 的原生件（macos-alias / fs-xattr）：`os` 字段只对**可选依赖**生效，
  # 而 appdmg 是普通 devDependency，白名单一开，Linux runner 也会照样 node-gyp 编译并炸
  # （实测 `#error This platform is not implemented yet`，CI 三个 job 全卡在 pnpm install）。
  # mac 侧由 scripts/collect-bundle.mjs 的 rebuildNativeDeps() 在需要时用当前 node 现编。
