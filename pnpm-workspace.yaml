packages:
  - apps/*
  - packages/*
  - apps/web/src/components/workbench/zcode

ignoredBuiltDependencies:
  - '@biomejs/biome'
  - msw
  # 只分发 Postgres 17 二进制；其 postinstall 仅重建 POSIX 符号链接（Windows 上无意义）
  - '@embedded-postgres/windows-x64'

onlyBuiltDependencies:
  - esbuild
  - sharp
  # 真实交互终端要的是 PTY（conpty），必须让它跑 native 构建/预编译下载
  - node-pty
  # 不要往这里加 appdmg 的原生件（macos-alias / fs-xattr）：`os` 字段只对**可选依赖**生效，
  # 而 appdmg 是普通 devDependency，白名单一开，Linux runner 也会照样 node-gyp 编译并炸
  # （实测 `#error This platform is not implemented yet`，CI 三个 job 全卡在 pnpm install）。
  # mac 侧由 scripts/collect-bundle.mjs 的 rebuildNativeDeps() 在需要时用当前 node 现编。
