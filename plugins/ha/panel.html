<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智能家居</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #12141c;
        --panel: #1b1e29;
        --line: #2b3040;
        --text: #e7e9f2;
        --muted: #9aa1b5;
        --accent: #7f9cf5;
        --on-accent: #12141c;
        --danger: #f08a8a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f8fb;
          --panel: #ffffff;
          --line: #e3e6ef;
          --text: #22262f;
          --muted: #6b7280;
          --accent: #4c63b6;
          --on-accent: #ffffff;
          --danger: #b4453f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        scrollbar-gutter: stable;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      header .grow {
        flex: 1;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
      }
      button {
        font: inherit;
        font-size: 12px;
        line-height: 1;
        height: 28px;
        padding: 0 10px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.primary {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      button.primary:hover {
        color: var(--on-accent);
        filter: brightness(1.06);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      /* 一行一个配置项：标签在左（不换行）、控件在右（撑满剩余宽度） */
      .field {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        margin: 8px 0;
      }
      .field label {
        color: var(--muted);
        white-space: nowrap;
      }
      .field input:not([type="checkbox"]),
      .field select {
        width: 100%;
        min-width: 0;
      }
      .field input:not([type="checkbox"]) {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 30px;
        padding: 0 10px;
      }
      .field input:focus-visible,
      .field select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .group {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
      }
      .device {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .device.offline {
        opacity: 0.6;
      }
      .device h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 6px;
      }
      /* 一行一个配置项/控件：标签在左、控件在右 */
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .row .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .value {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .row .value.off {
        color: var(--danger);
      }
      .switch {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--bg);
        position: relative;
        cursor: pointer;
        flex: none;
        padding: 0;
      }
      .switch[data-on="1"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch i {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.12s ease;
      }
      .switch[data-on="1"] i {
        left: 20px;
      }
      input[type="range"] {
        flex: 1;
        min-width: 90px;
        accent-color: var(--accent);
      }
      select {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        max-width: 55%;
      }
      .buttons {
        display: flex;
        gap: 6px;
      }
      /* === 欢迎与品牌选择（未配置态，按教程里 HA 集成流程的形状）=== */
      a {
        color: var(--accent);
      }
      .hero {
        text-align: center;
        padding: 22px 14px 18px;
      }
      .hero img {
        width: 52px;
        height: 52px;
      }
      .hero h1 {
        font-size: 16px;
        margin: 8px 0 2px;
      }
      .hero p {
        margin: 0;
      }
      .brand {
        margin: 6px 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }
      .brand summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .brand summary::-webkit-details-marker {
        display: none;
      }
      .brand-icon {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #fff;
      }
      .brand-icon.xiaomi {
        background: #ff6900;
      }
      .brand-icon.huawei {
        background: #c7000b;
      }
      .brand-meta {
        flex: 1;
        min-width: 0;
      }
      .brand-name {
        display: block;
        font-weight: 600;
      }
      .brand-sub {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .brand .chev {
        flex: none;
        color: var(--muted);
        transition: transform 0.12s ease;
      }
      .brand[open] .chev {
        transform: rotate(90deg);
      }
      /* === 集成管理（已连接态）：品牌行 + 行内配置流 === */
      /* 配置/欢迎视图：内容列居中，表单在宽面板里不被拉成一条 */
      body:not(.native-mode) > #body {
        max-width: 600px;
        margin: 0 auto;
      }
      .integrations {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        overflow: hidden;
      }
      .integrations .group {
        margin: 0;
        padding: 12px 14px 8px;
      }
      .integrations-body {
        padding-bottom: 6px;
      }
      /* 一行三列：左 = 品牌（图标+名称），中 = 状态或表单，右 = 动作 */
      .int-item {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) max-content;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
      }
      .int-item + .int-item {
        border-top: 1px solid var(--line);
      }
      .int-id {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .int-id .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 12px;
      }
      .int-name {
        font-weight: 600;
        white-space: nowrap;
      }
      .int-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .int-main > p {
        margin: 0;
      }
      .int-status {
        color: var(--muted);
        font-size: 12px;
      }
      .int-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .int-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .int-form .field {
        margin: 0;
      }
      .back {
        margin: 0 0 10px;
        color: var(--muted);
        background: transparent;
        border-color: transparent;
      }
      .back:hover {
        color: var(--text);
        background: var(--panel);
        border-color: var(--line);
      }
      .int-open {
        display: inline-flex;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        text-decoration: none;
        font-size: 12px;
        white-space: nowrap;
      }
      .int-open:hover {
        color: var(--on-accent);
        filter: brightness(1.06);
      }
      .guide .step {
        margin: 6px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }
      .guide .step summary {
        cursor: pointer;
        padding: 6px 10px;
        font-weight: 600;
      }
      .guide .step-body {
        padding: 0 10px 8px;
      }
      .guide .step-text {
        margin: 4px 0;
        font-size: 12px;
      }
      .command {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .command pre {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 6px 8px;
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .command button {
        flex: none;
      }
      /* === HA 原生界面（内嵌 iframe）=== */
      .native {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .native details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }
      .native details summary {
        cursor: pointer;
        padding: 4px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .native details pre {
        margin: 0;
        padding: 6px 10px 10px;
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        color: var(--text);
      }
      .native iframe {
        width: 100%;
        height: calc(100vh - 124px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      /* === 原生视图：标题栏之下全部是内嵌面板（2026-10-26 用户口径）===
         `native-mode` 必须挂在 <body>：header/footer 是 body 的子元素、不在 main 内，
         只给 main 加类会漏掉 body 的 16px 内边距和空 header（面板四周的「缝隙」）。
         高度链 html → body → main#body 逐级 100%，iframe 直接铺满 main。 */
      html:has(> body.native-mode),
      html:has(> body.native-mode) > body {
        height: 100%;
      }
      body.native-mode {
        padding: 0;
        overflow: hidden;
        scrollbar-gutter: auto;
      }
      body.native-mode > header,
      body.native-mode > footer {
        display: none;
      }
      body.native-mode > #body {
        height: 100%;
        padding: 0;
      }
      body.native-mode > #body > iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
      }
      footer {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <!-- 标题由宿主弹窗 chrome 出（图标 + 名称 + 关闭），配置入口也在宿主标题栏
           （面板声明 configurable，2026-10-25 用户口径「配置按钮放到关闭按钮左边」）：
           默认视图 = 纯 HA 界面 -->
      <span id="state" class="hint"></span>
    </header>
    <main id="body">
      <div class="card hint">正在获取配置…</div>
    </main>
    <footer id="footer">
      <p id="note" hidden></p>
    </footer>
    <!-- 面板脚本是经典脚本（无 import/export）：与米家面板同一口径，避开宿主 WebView
         拒同源 module 请求的问题 -->
    <script src="./panel.js"></script>
  </body>
</html>
