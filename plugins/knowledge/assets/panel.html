<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#fff;--fg:#1a1d26;--muted:#8b93a5;--line:#eef0f4;--line2:#e2e6ee;
    --card:#fafbfc;--hover:#f4f6fa;--primary:#2f6bff;--primary-soft:#eaf0ff;
    --shadow-lift:0 6px 20px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15171c;--fg:#e9ecf2;--muted:#8b93a5;--line:#242830;--line2:#2e3340;
      --card:#1b1e25;--hover:#20242c;--primary:#7aa2ff;--primary-soft:#1e2a44;
      --shadow-lift:0 8px 24px rgba(0,0,0,.45);}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
    background:var(--card);color:var(--muted);font-size:11px;border:1px solid var(--line)}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .pill.ok .d{background:#22c55e}.pill.warn .d{background:#f59e0b}.pill.err .d{background:#ef4444}
  .spacer{flex:1}
  .ghost{height:28px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--muted);
    font:inherit;font-size:12px;cursor:pointer;transition:.15s}
  .ghost:hover{background:var(--hover);color:var(--fg)}
  .ghost svg{width:14px;height:14px}

  .searchwrap{position:relative;margin:11px 14px 0}
  .searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--muted);pointer-events:none}
  .search{width:100%;padding:8px 10px 8px 31px;border:1px solid var(--line2);border-radius:9px;
    background:var(--card);color:var(--fg);font:inherit;font-size:12.5px}
  .search:focus{outline:none;border-color:var(--primary);background:var(--bg)}
  .search::placeholder{color:var(--muted)}

  .cats{display:flex;gap:6px;padding:10px 14px 8px;overflow-x:auto;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:none;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);
    background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
  .cat:hover{background:var(--hover);color:var(--fg)}
  .cat.on{background:var(--primary-soft);border-color:transparent;color:var(--primary);font-weight:600}
  .cat .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}

  .drop{margin:0 14px 10px;padding:9px 12px;border:1px dashed var(--line2);border-radius:9px;
    color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px;cursor:pointer;
    transition:.15s;background:transparent}
  .drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
  .drop svg{width:15px;height:15px;flex:none}
  .drop input{display:none}
  .drop .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .grid{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 18px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;align-content:start}
  .tile{border:1px solid var(--line);border-radius:11px;background:var(--card);
    padding:12px 10px 9px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;
    align-items:center;gap:7px}
  .tile:hover{border-color:var(--line2);background:var(--hover);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  .tile .thumb{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .tile .thumb svg{width:19px;height:19px}
  .tile .nm{width:100%;text-align:center;font-size:11.5px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .tile .sz{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .c-doc{background:#e8f0ff;color:#2f6bff}
  .c-code{background:#e7f7ef;color:#0f9d58}
  .c-sheet{background:#e9f7ec;color:#1a7f37}
  .c-slide{background:#fff1e6;color:#d97706}
  .c-image{background:#f3e9ff;color:#8b5cf6}
  .c-other{background:#eef1f6;color:#64748b}
  @media (prefers-color-scheme:dark){
    .c-doc{background:#1c2a44;color:#8ab0ff}.c-code{background:#14301f;color:#4ade80}
    .c-sheet{background:#14301f;color:#4ade80}.c-slide{background:#3a2612;color:#fbbf24}
    .c-image{background:#2a1f42;color:#c4a5ff}.c-other{background:#232833;color:#94a3b8}
  }

  .hits{padding:0 14px 18px;overflow-y:auto;max-height:45%}
  .hit{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    margin-bottom:7px;cursor:pointer}
  .hit:hover{border-color:var(--line2);background:var(--hover)}
  .hit .hl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-bottom:4px}
  .hit .hl b{color:var(--fg);font-weight:600;font-size:11.5px}
  .hit .body{font-size:12px;color:var(--fg);white-space:pre-wrap;word-break:break-word;
    max-height:66px;overflow:hidden}

  .blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;color:var(--muted);padding:28px 20px;text-align:center}
  .blank svg{width:42px;height:42px;opacity:.45}
  .blank b{font-size:12.5px;font-weight:600;color:var(--fg)}
  .blank span{font-size:11.5px}
  .err{margin:0 14px 10px;padding:7px 10px;border-radius:8px;background:rgba(239,68,68,.1);
    color:#dc2626;font-size:11.5px}
  @media (prefers-color-scheme:dark){.err{color:#fca5a5}}

  .sheet{position:fixed;inset:0;background:rgba(15,18,25,.32);display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
  .sheet.on{opacity:1;pointer-events:auto}
  .sheet .panel{width:100%;max-height:82%;background:var(--bg);border-radius:14px 14px 0 0;
    display:flex;flex-direction:column;transform:translateY(12px);transition:transform .18s;
    box-shadow:0 -8px 30px rgba(16,24,40,.18)}
  .sheet.on .panel{transform:translateY(0)}
  .sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .sheet .hd .t{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .sheet pre{margin:0;padding:13px 14px;overflow:auto;flex:1;font:12px/1.6 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
  <div class="top">
    <span class="pill" id="pill"><span class="d"></span><span id="pilltext">就绪</span></span>
    <span class="spacer"></span>
    <button class="ghost" id="refresh" title="刷新"></button>
  </div>

  <div class="searchwrap" id="search-icon"></div>
  <input class="search" id="q" type="search" placeholder="搜索文件或内容" autocomplete="off">

  <div class="cats" id="cats"></div>

  <label class="drop" id="drop">
    <input type="file" id="file" multiple>
    <span id="drop-icon"></span>
    <span class="grow"><b style="font-weight:600;color:var(--fg)">上传文件</b>　拖到这里也行</span>
  </label>
  <p class="err" id="err" hidden></p>

  <div class="grid" id="grid"></div>
  <div class="hits" id="hits" hidden></div>

  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="hd"><span class="t" id="sheet-title"></span><button class="ghost" id="sheet-close">关闭</button></div>
      <pre id="sheet-body"></pre>
    </div>
  </div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const SVG = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
  empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5Z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v7"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>',
  slide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 17v4M8 21h8"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
};
$("refresh").innerHTML = SVG.refresh;
$("search-icon").innerHTML = SVG.search;
$("drop-icon").innerHTML = SVG.upload;

const CATS = [
  { key: "all", label: "全部" },
  { key: "doc", label: "文档" },
  { key: "code", label: "代码" },
  { key: "sheet", label: "表格" },
  { key: "slide", label: "演示" },
  { key: "image", label: "图片" },
  { key: "other", label: "其他" },
];
const ICON_BY_CAT = { doc: "doc", code: "code", sheet: "sheet", slide: "slide", image: "image", other: "other" };

const state = { files: [], cat: "all", keyword: "", busy: false };

function text(node, value) { node.textContent = value == null ? "" : String(value); }
function humanSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}
function showError(message) {
  const node = $("err");
  node.hidden = !message;
  text(node, message || "");
}

async function api(path, options) {
  const isForm = options && options.body instanceof FormData;
  const response = await fetch(path, {
    credentials: "include",
    ...(options || {}),
    ...(isForm ? {} : { headers: { "content-type": "application/json" } }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error((data && data.error && data.error.message) || "请求失败（" + response.status + "）");
  }
  return data;
}

function renderStatus(status) {
  const pill = $("pill");
  const label = $("pilltext");
  let value = "就绪", level = "ok";
  if (!status.installed) { value = "未安装"; level = ""; }
  else if (!status.enabled) { value = "已停用"; level = ""; }
  else if (status.cli === "unsupported_platform") { value = "平台不支持"; level = "err"; }
  else if (status.cli === "missing") { value = "CLI 缺失"; level = "err"; }
  else if (status.reason) { value = "本地匹配"; level = "warn"; }
  pill.className = "pill " + level;
  text(label, value);
}

function renderCats() {
  const box = $("cats");
  box.replaceChildren();
  const count = (key) => key === "all"
    ? state.files.length
    : state.files.filter((f) => f.category === key).length;
  for (const cat of CATS) {
    const n = count(cat.key);
    if (cat.key !== "all" && n === 0) continue;
    const chip = document.createElement("button");
    chip.className = "cat" + (state.cat === cat.key ? " on" : "");
    text(chip, cat.label);
    if (n > 0) {
      const badge = document.createElement("span");
      badge.className = "n";
      text(badge, String(n));
      chip.append(badge);
    }
    chip.addEventListener("click", () => { state.cat = cat.key; renderAll(); });
    box.append(chip);
  }
}

function visibleFiles() {
  const kw = state.keyword.trim().toLowerCase();
  return state.files.filter((file) => {
    if (state.cat !== "all" && file.category !== state.cat) return false;
    if (kw && !file.path.toLowerCase().includes(kw)) return false;
    return true;
  });
}

function renderGrid() {
  const grid = $("grid");
  grid.replaceChildren();
  const files = visibleFiles();
  if (files.length === 0) {
    const blank = document.createElement("div");
    blank.className = "blank";
    blank.innerHTML = SVG.empty;
    const b = document.createElement("b");
    text(b, state.files.length === 0 ? "还没有文件" : "没有匹配的文件");
    const s = document.createElement("span");
    text(
      s,
      state.files.length === 0
        ? "上传后对话会自动带上相关内容"
        : "换个分类或关键词试试",
    );
    blank.append(b, s);
    grid.append(blank);
    return;
  }
  for (const file of files) {
    const tile = document.createElement("div");
    tile.className = "tile";
    const thumb = document.createElement("div");
    thumb.className = "thumb c-" + (file.category || "other");
    thumb.innerHTML = SVG[ICON_BY_CAT[file.category] || "other"];
    const name = document.createElement("div");
    name.className = "nm";
    text(name, file.path);
    name.title = file.path;
    const size = document.createElement("div");
    size.className = "sz";
    text(size, humanSize(file.sizeBytes));
    tile.append(thumb, name, size);
    tile.addEventListener("click", () => openFile(file));
    grid.append(tile);
  }
}

async function openFile(file) {
  text($("sheet-title"), file.path);
  text($("sheet-body"), "读取中…");
  $("sheet").classList.add("on");
  try {
    const payload = await api("/api/knowledge/read?path=" + encodeURIComponent(file.absolutePath));
    text($("sheet-body"), payload.content || "（空文件）");
  } catch (error) {
    text($("sheet-body"), error.message);
  }
}

async function loadStatus() {
  try { renderStatus(await api("/api/knowledge/status")); }
  catch { $("pill").className = "pill err"; text($("pilltext"), "不可用"); }
}

async function loadLibrary() {
  try {
    const payload = await api("/api/knowledge/library");
    state.files = payload.files || [];
    renderAll();
    showError("");
  } catch (error) { showError(error.message); }
}

function renderAll() { renderCats(); renderGrid(); }

async function upload(files) {
  if (!files || files.length === 0 || state.busy) return;
  state.busy = true;
  showError("");
  for (const file of files) {
    const form = new FormData();
    form.append("file", file, file.name);
    try { await api("/api/knowledge/library", { method: "POST", body: form }); }
    catch (error) { showError(file.name + "：" + error.message); }
  }
  state.busy = false;
  await loadLibrary();
  await loadStatus();
}

let searchTimer;
async function searchContent() {
  const query = state.keyword.trim();
  const hits = $("hits");
  if (!query) { hits.hidden = true; hits.replaceChildren(); return; }
  try {
    const payload = await api("/api/knowledge/search", {
      method: "POST",
      body: JSON.stringify({ query }),
    });
    hits.replaceChildren();
    hits.hidden = false;
    const results = payload.results || [];
    if (results.length === 0) {
      const empty = document.createElement("div");
      empty.className = "blank";
      text(empty, "没有找到相关内容");
      hits.append(empty);
      return;
    }
    for (const item of results) {
      const hit = document.createElement("div");
      hit.className = "hit";
      const hl = document.createElement("div");
      hl.className = "hl";
      const name = String(item.path || "").replace(/^.*[\\/]/u, "");
      const strong = document.createElement("b");
      text(strong, name);
      hl.append(strong, document.createTextNode("　" + item.startLine + "-" + item.endLine));
      const body = document.createElement("div");
      body.className = "body";
      text(body, item.content || "");
      hit.append(hl, body);
      hit.addEventListener("click", () => openFile({ path: name, absolutePath: item.absolutePath }));
      hits.append(hit);
    }
  } catch (error) { showError(error.message); }
}

const drop = $("drop");
["dragenter", "dragover"].forEach((type) =>
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((type) =>
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (event) => { void upload(event.dataTransfer && event.dataTransfer.files); });
$("file").addEventListener("change", (event) => {
  void upload(event.target.files);
  event.target.value = "";
});

$("refresh").addEventListener("click", () => { void loadStatus(); void loadLibrary(); });
$("sheet-close").addEventListener("click", () => $("sheet").classList.remove("on"));
$("sheet").addEventListener("click", (event) => {
  if (event.target === $("sheet")) $("sheet").classList.remove("on");
});
$("q").addEventListener("input", () => {
  state.keyword = $("q").value;
  renderGrid();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { void searchContent(); }, 450);
});

void loadStatus();
void loadLibrary();
setInterval(loadStatus, 10000);
</script>
</body>
</html>
