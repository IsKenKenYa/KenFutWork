<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unity">
  <g stroke-linecap="round" stroke-linejoin="round">
  <!-- 自绘：场景层级（三级缩进 + 连接线），对应「场景里挂着多个物件」。
       前两版（中心方块 + 圆点、直角树 + 三块方框）在 16px 下都糊成一团；
       这版只留三条横条按层级缩进，块与块之间留足空档，缩到 16px 仍是「三个层级」。 -->
  <path
    d="M3.4 5.2h4M3.4 12h7.6M3.4 18.8h11.2"
    fill="none"
    stroke="currentColor"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M3.4 5.2v13.6"
    fill="none"
    stroke="currentColor"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.55"
  />
  </g>
</svg>
