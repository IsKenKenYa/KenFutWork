<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>米家</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #12141c;
        --panel: #1b1e29;
        --line: #2b3040;
        --text: #e7e9f2;
        --muted: #9aa1b5;
        --accent: #7f9cf5;
        --danger: #f08a8a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f8fb;
          --panel: #ffffff;
          --line: #e3e6ef;
          --text: #22262f;
          --muted: #6b7280;
          --accent: #4c63b6;
          --danger: #b4453f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        /* 整页滚动（页脚留在内容流里）；滚动条槽位恒定，不因内容重建而横跳 */
        scrollbar-gutter: stable;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      header .grow {
        flex: 1;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--danger);
        font-size: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .login {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px;
      }
      .login img {
        width: 200px;
        height: 200px;
        image-rendering: pixelated;
        background: #fff;
        border-radius: 8px;
        padding: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
      }
      .device {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .device.offline {
        opacity: 0.6;
      }
      .device h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .row .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .value {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .switch {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--bg);
        position: relative;
        cursor: pointer;
        flex: none;
      }
      .switch[data-on="1"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch i {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.12s ease;
      }
      .switch[data-on="1"] i {
        left: 20px;
      }
      input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }
      select {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        max-width: 55%;
      }
      footer {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <!-- 标题由宿主弹窗 chrome 出（图标 + 名称），面板里不重复出，只留状态与操作 -->
      <span id="state" class="hint"></span>
      <span class="grow"></span>
      <button id="refresh" type="button" hidden>刷新</button>
      <button id="disconnect" type="button" hidden>断开</button>
    </header>
    <main id="body">
      <div class="card hint">正在获取登录态…</div>
    </main>
    <!-- 页脚两块分开：瞬时消息（#note）与「规格解析失败」卡片（renderSpecErrors 管理）——
         轮询只清瞬时消息，不动失败卡片，页面高度才稳定（否则滚动条每 5 秒抖一次） -->
    <footer id="footer">
      <p id="note" hidden></p>
    </footer>
    <!--
      加载方式说明（不要改回 `<script type="module" src="./panel.js">`）：

      实测部分宿主 WebView / 网络中间层会把**同源 module 请求**拒掉（响应 403、请求根本到不了
      服务端；同一 URL 的 fetch 与经典 script 都正常）。面板曾因此在真机永远停在静态占位
      「正在获取登录态…」。这里改为：fetch 文本 → objectURL 动态 import 两个 lib（lib 源码
      保持 ESM，宿主侧单测仍可直接 import）→ 能力挂到 window → 以**经典脚本**加载 panel.js。
    -->
    <script>
      (async () => {
        const importText = async (path) => {
          const text = await (await fetch(path, { cache: "no-store" })).text();
          return import(
            URL.createObjectURL(
              new Blob([text], { type: "text/javascript" }),
            )
          );
        };
        try {
          window.QRRefresh = await importText("./lib/qr-refresh.js");
          window.PanelHostMessage = await importText(
            "./lib/panel-host-message.js",
          );
        } catch (error) {
          const state = document.getElementById("state");
          if (state) {
            state.textContent = `面板脚本加载失败：${
              error instanceof Error ? error.message : String(error)
            }`;
          }
          return;
        }
        const script = document.createElement("script");
        script.src = "./panel.js";
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
