# 最小 SSRF 反代（dify 栈的 sandbox 出网专用）
#
# 为什么需要它：Dify 的 sandbox 容器是 SQL/Python 节点的**代码执行隔离边界**，它的出网
# 必须经反代收口——否则一次「python 节点请求内网地址」就能打到宿主所在内网（SSRF）。
# 本配置是**自写的最小版本**：只放行出网、禁掉私网/链路本地/元数据网段；
# Dify 官方那份 squid 配置更全（域名白名单等），如需要可自行替换本文件。
#
# 说明：169.254.0.0/16 含云元数据地址（169.254.169.254）；100.64.0.0/10 是 CGNAT。

http_port 3128

# 关缓存：反代只做出口收口，不做内容缓存
cache deny all

acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10

http_access deny blocked_dst
http_access allow all

# ubuntu/squid 镜像里 squid 以 `proxy` 用户运行（没有 `squid` 用户——Squid 6 下
# 写 `cache_effective_user squid` 会 FATAL: getpwnam failed）。
cache_effective_user proxy
cache_effective_group proxy
coredump_dir /var/spool/squid

# 日志走 squid 默认落点（容器内 /var/log/squid）：显式指到 stdio:/dev/stdout 会触发
# Squid 6 的属主校验 FATAL（`/dev` 不可写），容器日志仍可用 `docker logs` 之外的
# `docker exec … tail /var/log/squid/access.log` 查。
